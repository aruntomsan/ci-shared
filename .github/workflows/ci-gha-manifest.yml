name: Build and push image
on:
  workflow_call:
    inputs:
      service-name:
        description: "Service name, also used as the ECR repository name"
        required: true
        type: string
      language:
        description: "go | java | csharp | node | python"
        required: true
        type: string
      language-version:
        description: "Toolchain version"
        required: false
        type: string
        default: ""
      context:
        description: "Docker build context, relative to the repo root"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path, relative to the repo root"
        required: false
        type: string
        default: "Dockerfile"

env:
  AWS_REGION: ap-south-2                 
  ECR_REGISTRY: 778477254970.dkr.ecr.ap-south-2.amazonaws.com
  IMAGE: 778477254970.dkr.ecr.ap-south-2.amazonaws.com/${{ inputs.service-name }}

jobs:
  build:
    name: build (${{ inputs.service-name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0 
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
      
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::778477254970:role/gha-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image Local
        uses: docker/build-push-action@v7
        with:
          load: true
          push: false
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ inputs.service-name  }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ inputs.service-name }}:latest
          build-args: |
            LANGUAGE=${{ inputs.language }}
            LANGUAGE_VERSION=${{ inputs.language-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0  
        with:
            image-ref: ${{ env.ECR_REGISTRY }}/${{ inputs.service-name }}:${{ github.sha }}
            format: table
            severity: CRITICAL,HIGH
            ignore-unfixed: true
            vuln-type: os,library
            exit-code: "1"
  
      - name: Dockle image lint
        run: |
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.dockleignore:/.dockleignore:ro" \
              goodwithtech/dockle:v0.4.15 \
              --exit-code 1 --exit-level fatal \
              ${{ env.ECR_REGISTRY }}/${{ inputs.service-name }}:${{ github.sha }}
  
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0  
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ inputs.service-name }}-${{ github.sha }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.service-name }}-${{ github.sha }}
          path: sbom-${{ inputs.service-name }}-${{ github.sha }}.cdx.json
          retention-days: 90

      - name: Push image
        run: |
            docker push ${{ env.ECR_REGISTRY }}/${{ inputs.service-name }}:${{ github.sha }}
            docker push ${{ env.ECR_REGISTRY }}/${{ inputs.service-name }}:latest